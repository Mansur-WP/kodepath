kind = "web"
previewPath = "/"
title = "KodePath"
version = "1.0.0"
id = "artifacts/kodepath"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21212

[services.development]
run = "pnpm --filter @workspace/kodepath run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kodepath", "run", "build" ]
publicDir = "artifacts/kodepath/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21212"
BASE_PATH = "/"
